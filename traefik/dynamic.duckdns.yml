# Traefik DuckDNS Dynamic Configuration
# - Router matched by Host() so Traefik proactively requests the cert at startup
# - OpenWA is single-port: dashboard, REST API and Socket.IO all live on openwa-api:2785,
#   so one router covers everything (Traefik forwards WebSocket upgrades automatically)

http:
  routers:
    openwa:
      rule: 'Host(`alucard-openws.duckdns.org`)'
      entryPoints:
        - websecure
      service: openwa
      tls:
        certResolver: letsencrypt

  services:
    openwa:
      loadBalancer:
        servers:
          - url: 'http://openwa-api:2785'
