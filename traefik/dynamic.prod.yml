# Traefik Production Dynamic Configuration
# - Router on the websecure (HTTPS) entrypoint with a Let's Encrypt (ACME) certificate
# - OpenWA is single-port: dashboard, REST API and Socket.IO all live on openwa-api:2785,
#   so one router covers everything (Traefik forwards WebSocket upgrades automatically)

http:
  routers:
    openwa:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - websecure
      service: openwa
      tls:
        certResolver: letsencrypt

  services:
    openwa:
      loadBalancer:
        servers:
          - url: 'http://openwa-api:2785'
