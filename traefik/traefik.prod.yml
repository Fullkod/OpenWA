# Traefik Production Static Configuration
# - HTTP on :80 redirects to HTTPS
# - HTTPS on :443 with automatic Let's Encrypt certificates
# - ACME via HTTP-01 challenge (requires ports 80/443 publicly reachable)

api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ':443'
    http:
      tls:
        certResolver: letsencrypt
    # Generous timeouts so Traefik doesn't cut the persistent Socket.IO connection
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s

certificatesResolvers:
  letsencrypt:
    acme:
      # EDIT ME: Traefik does NOT expand ${ENV} in the static file, so the email must be literal
      email: admin@example.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog: {}
