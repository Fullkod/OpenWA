# Traefik Self-Signed Dynamic Configuration
# - tls: {} with no certResolver => Traefik serves its built-in self-signed cert
# - Rule matches by PathPrefix only (no Host) so access by raw IP works
# - OpenWA is single-port: dashboard, REST API and Socket.IO all live on openwa-api:2785,
#   so one router covers everything (Traefik forwards WebSocket upgrades automatically)

http:
  routers:
    openwa:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - websecure
      service: openwa
      tls: {}

  services:
    openwa:
      loadBalancer:
        servers:
          - url: 'http://openwa-api:2785'
