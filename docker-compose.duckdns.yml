# OpenWA - DuckDNS + Let's Encrypt override (minimal footprint)
#
# Use with (NO profiles: SQLite + local storage, no Postgres/Redis/MinIO):
#   docker compose -f docker-compose.yml -f docker-compose.duckdns.yml pull openwa-api
#   docker compose -f docker-compose.yml -f docker-compose.duckdns.yml up -d --no-build --remove-orphans
#
# This override:
# - Runs the official prebuilt image (pinned), never builds on the server
# - Disables docker-proxy (we don't use Dashboard > Infrastructure built-in orchestration)
# - Caps openwa-api memory so it can never take the host down (OPENWA_MEM_LIMIT, default 1g)
# - Adds Traefik (no longer in the upstream compose) publicly on 80/443 with a real
#   Let's Encrypt certificate for the DuckDNS domain, reusing the existing 'openwa_letsencrypt' volume
# - The dashboard is bundled in openwa-api (port 2785), so Traefik routes everything there

services:
  docker-proxy:
    profiles: ['disabled']

  openwa-api:
    image: ghcr.io/rmyndharis/openwa:${OPENWA_VERSION:-0.27.1}
    mem_limit: ${OPENWA_MEM_LIMIT:-1g}
    environment:
      # Seeds a key only when api_keys is empty, and refuses to boot in production on a weak value.
      # Existing keys live in data/main.sqlite: never forward a master key here.
      - API_MASTER_KEY=

  traefik:
    image: traefik:v3.0
    container_name: openwa-traefik
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    networks:
      - openwa-network
    volumes:
      - ./traefik/traefik.duckdns.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.duckdns.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    depends_on:
      - openwa-api

volumes:
  letsencrypt:
    name: openwa_letsencrypt
    driver: local
